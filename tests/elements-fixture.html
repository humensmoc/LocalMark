<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>元素标注测试</title>
<style>
body{margin:0;background:#f4f2ed;color:#25353d;font:17px/1.7 system-ui}main{max-width:820px;margin:160px auto 60px;padding:24px}h1{font-size:28px;margin:0 0 20px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}article{padding:22px;border:1px solid #d4d9d5;border-radius:14px;background:#fff}h2{font-size:21px;margin:0 0 12px}p{margin:14px 0}button,a{cursor:pointer}button{padding:8px 16px;border:1px solid #bdd1c5;border-radius:6px;background:#e9f4ed}a{color:#357959}img{display:block;width:130px;height:110px;margin:16px 0}.scroller{margin-top:35px;height:180px;overflow:auto;border:1px solid #b4c2bc;padding:12px}.scroll-content{height:500px}.scroll-card{margin-top:100px;height:150px;background:#e1ece6;padding:12px}.bottom{height:700px}@media(max-width:600px){main{padding:16px;margin-top:180px}.cards{grid-template-columns:1fr}}
</style></head><body><main>
<h1>把一张卡片作为思考的对象</h1>
<div class="cards"><article data-id="design-card" id="design-card"><h2 id="card-heading">阅读与设计</h2><p id="card-text">选择整个模块，也可以继续高亮其中的一句话。</p><button id="card-button">原网页按钮</button> <a id="card-link" href="#details">原网页链接</a><img id="card-image" src="/site-icon.svg" alt="卡片中的设计示意图"></article>
<article data-id="other-card"><h2>另一张卡片</h2><p>页面顺序可以变化，批注仍应属于原来的内容。</p></article></div>
<div class="scroller" id="scroller"><div class="scroll-content"><section class="scroll-card" id="scroll-card">嵌套滚动区域中的元素标注</section></div></div><div class="bottom"></div>
</main><script>window.buttonClicks=0;window.linkClicks=0;document.getElementById('card-button').onclick=()=>window.buttonClicks++;document.getElementById('card-link').onclick=e=>{e.preventDefault();window.linkClicks++};</script></body></html>
